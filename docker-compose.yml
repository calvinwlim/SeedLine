# Local development services. Start with: docker compose up -d
# Credentials match apps/api/.env.example.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmat
      POSTGRES_PASSWORD: openmat
      POSTGRES_DB: openmat
    ports:
      - '5432:5432'
    volumes:
      - openmat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmat']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - openmat_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openmat_pg:
  openmat_redis:
